<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Reset Your Password</title></head>
<body style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;padding:20px;">
  <h1 style="color:#2563eb;">Password Reset Request</h1>
  <p>Hi <strong>{{UserName}}</strong>,</p>
  <p>We received a request to reset your password. Click the button below to set a new password.</p>
  <p>
    <a href="{{ResetUrl}}"
       style="background:#dc2626;color:#fff;padding:12px 24px;text-decoration:none;border-radius:6px;display:inline-block;">
      Reset Password
    </a>
  </p>
  <p style="color:#6b7280;">This link expires in <strong>{{ExpiresIn}}</strong>.</p>
  <p style="color:#6b7280;">If you did not request a password reset, please ignore this email.</p>
  <hr style="border:none;border-top:1px solid #e5e7eb;margin:24px 0;">
  <p style="color:#6b7280;font-size:12px;">{{AppName}} Security Team</p>
</body>
</html>
