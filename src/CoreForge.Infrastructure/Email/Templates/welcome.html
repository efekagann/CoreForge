<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Welcome to {{AppName}}</title></head>
<body style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;padding:20px;">
  <h1 style="color:#2563eb;">Welcome to {{AppName}}!</h1>
  <p>Hi <strong>{{UserName}}</strong>,</p>
  <p>Thank you for registering. Your account is now active.</p>
  <p>
    <a href="{{DashboardUrl}}"
       style="background:#2563eb;color:#fff;padding:12px 24px;text-decoration:none;border-radius:6px;display:inline-block;">
      Go to Dashboard
    </a>
  </p>
  <hr style="border:none;border-top:1px solid #e5e7eb;margin:24px 0;">
  <p style="color:#6b7280;font-size:12px;">You received this email because you registered at {{AppName}}.</p>
</body>
</html>
